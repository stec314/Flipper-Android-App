name: Manual Debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to build'
        required: false
        default: 'claude/pensive-hawking-nmsljd'

jobs:
  build_debug_apk:
    name: "Build debug APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: 'recursive'
      - name: Set up JDK 1.21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_is_google_feature: false
          ORG_GRADLE_PROJECT_source_install: github
          ORG_GRADLE_PROJECT_flipper_buildfetch_token: ${{ secrets.GRADLE_REMOTE_CACHE_TOKEN }}
        run: ./gradlew :instances:android:app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flipper-zero-debug-apk
          path: instances/android/app/build/outputs/apk/debug/*.apk
